services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: imprimiaqui3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imprimiaqui
      POSTGRES_PASSWORD: imprimiaqui_secure_2026
      POSTGRES_DB: imprimiaqui3d
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - imprimiaqui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imprimiaqui -d imprimiaqui3d"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: imprimiaqui3d-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secure_2026 --appendonly yes
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - imprimiaqui-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: imprimiaqui3d-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
    env_file:
      - ./backend/.env.production
    ports:
      - "13001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - imprimiaqui-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: imprimiaqui3d-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    env_file:
      - ./frontend/.env.production
    ports:
      - "13000:3000"
    depends_on:
      - backend
    networks:
      - imprimiaqui-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: imprimiaqui3d-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - imprimiaqui-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  imprimiaqui-network:
    driver: bridge
